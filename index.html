<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Coin Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            tiktokRed: '#FE2C55',
            tiktokGold: '#FFB800',
            tiktokGoldBorder: '#E6A100'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #111827;
      min-height: 100vh;
    }
    /* Subtle touch active state */
    .tap-effect:active {
      transform: scale(0.985);
    }
    /* Confetti & Fireworks Canvas overlay */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between antialiased selection:bg-tiktokRed selection:text-white relative overflow-x-hidden">

  <!-- Fullscreen Fireworks / Confetti Canvas ("салютики") -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Main Content Center Container -->
  <main class="w-full flex-1 flex flex-col items-center justify-center p-3 sm:p-6">
    
    <div class="w-full max-w-sm sm:max-w-md bg-white rounded-2xl sm:rounded-3xl border border-gray-200 shadow-xl overflow-hidden">
      
      <!-- Top URL / Bar (Light theme) -->
      <div class="bg-gray-100 border-b border-gray-200 px-4 py-2.5 flex items-center justify-between text-xs text-gray-600">
        <div class="flex items-center space-x-1.5 font-mono text-[11px] truncate">
          <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
          </svg>
          <span class="truncate">r051.hosting.ovh.net</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="soundToggle" type="button" class="text-[11px] text-gray-500 hover:text-gray-900 transition flex items-center gap-1">
            <svg id="soundSvg" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            <span id="soundLabel">Sound ON</span>
          </button>
        </div>
      </div>

      <!-- Top Text Banner (English translation of video banner) -->
      <div class="bg-gray-50 border-b border-gray-200 py-3 px-4 text-center">
        <h1 class="text-sm sm:text-base font-extrabold text-gray-800 tracking-tight">
          TikTok Coin Link In Bio
        </h1>
      </div>

      <!-- Generator Body -->
      <div class="p-5 sm:p-7 space-y-5">
        
        <!-- Header title: Get Coins -->
        <div class="text-center">
          <h2 class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tight">
            Get Coins
          </h2>
          <div class="flex items-center justify-between mt-3 text-xs text-gray-500 font-semibold px-1">
            <span>Selected: <span id="selectedCount" class="text-gray-900 font-bold">1</span> of 4</span>
            <button type="button" id="toggleSelectAllBtn" class="text-tiktokRed hover:underline cursor-pointer">
              Select All 4
            </button>
          </div>
        </div>

        <!-- 4 Coin Packages (All 4 can be selected at the same time) -->
        <div class="space-y-3" id="packagesList">
          
          <!-- Package 1: 1,400 -->
          <div class="package-item tap-effect cursor-pointer bg-white border-2 border-gray-200 hover:border-gray-400 rounded-2xl p-4 transition duration-150 flex items-center justify-between select-none relative" data-amount="1400">
            <!-- Left checkmark circle (as shown in video) -->
            <div class="check-circle w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center transition">
              <svg class="check-svg w-3.5 h-3.5 text-white opacity-0 transition" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
            </div>
            <!-- Coin + Amount -->
            <div class="flex items-center space-x-3 pr-4">
              <!-- TikTok Gold Coin with Star -->
              <img src="https://i.postimg.cc/mkg68Cn0/Zolotaa-moneta-Tik-Tok-so-zvezdoj.png" alt="TikTok Coin" class="w-8 h-8 object-contain shrink-0 drop-shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/32x32/FFB800/FFFFFF?text=🪙'">
              <span class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tight">1,400</span>
            </div>
            <div></div>
          </div>

          <!-- Package 2: 3,500 -->
          <div class="package-item tap-effect cursor-pointer bg-white border-2 border-gray-200 hover:border-gray-400 rounded-2xl p-4 transition duration-150 flex items-center justify-between select-none relative" data-amount="3500">
            <!-- Left checkmark circle -->
            <div class="check-circle w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center transition">
              <svg class="check-svg w-3.5 h-3.5 text-white opacity-0 transition" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
            </div>
            <!-- Coin + Amount -->
            <div class="flex items-center space-x-3 pr-4">
              <img src="https://i.postimg.cc/mkg68Cn0/Zolotaa-moneta-Tik-Tok-so-zvezdoj.png" alt="TikTok Coin" class="w-8 h-8 object-contain shrink-0 drop-shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/32x32/FFB800/FFFFFF?text=🪙'">
              <span class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tight">3,500</span>
            </div>
            <div></div>
          </div>

          <!-- Package 3: 7,000 (Selected by default like in video start) -->
          <div class="package-item tap-effect cursor-pointer bg-gray-50 border-2 border-gray-800 rounded-2xl p-4 transition duration-150 flex items-center justify-between select-none relative" data-amount="7000">
            <!-- Left checkmark circle -->
            <div class="check-circle w-6 h-6 rounded-full border-2 border-gray-800 bg-gray-800 flex items-center justify-center transition">
              <svg class="check-svg w-3.5 h-3.5 text-white opacity-100 transition" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
            </div>
            <!-- Coin + Amount -->
            <div class="flex items-center space-x-3 pr-4">
              <img src="https://i.postimg.cc/mkg68Cn0/Zolotaa-moneta-Tik-Tok-so-zvezdoj.png" alt="TikTok Coin" class="w-8 h-8 object-contain shrink-0 drop-shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/32x32/FFB800/FFFFFF?text=🪙'">
              <span class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tight">7,000</span>
            </div>
            <div></div>
          </div>

          <!-- Package 4: 100,000 (All 4 selectable) -->
          <div class="package-item tap-effect cursor-pointer bg-white border-2 border-gray-200 hover:border-gray-400 rounded-2xl p-4 transition duration-150 flex items-center justify-between select-none relative" data-amount="100000">
            <!-- Left checkmark circle -->
            <div class="check-circle w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center transition">
              <svg class="check-svg w-3.5 h-3.5 text-white opacity-0 transition" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
            </div>
            <!-- Coin + Amount -->
            <div class="flex items-center space-x-3 pr-4">
              <img src="https://i.postimg.cc/mkg68Cn0/Zolotaa-moneta-Tik-Tok-so-zvezdoj.png" alt="TikTok Coin" class="w-8 h-8 object-contain shrink-0 drop-shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/32x32/FFB800/FFFFFF?text=🪙'">
              <span class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tight">100,000</span>
            </div>
            <div></div>
          </div>

        </div>

        <!-- Credentials Form (As shown in video) -->
        <form id="coinForm" class="space-y-3 pt-2" onsubmit="event.preventDefault(); submitCoins();">
          
          <!-- Username input -->
          <div>
            <input 
              type="text" 
              id="usernameInput" 
              value="downtown99048" 
              placeholder="Username" 
              class="w-full px-4 py-3 bg-white hover:bg-gray-50 focus:bg-white text-gray-900 border border-gray-300 rounded-xl font-medium focus:ring-2 focus:ring-tiktokRed focus:border-transparent outline-none transition text-sm shadow-sm"
              required
            >
          </div>

          <!-- Password input -->
          <div>
            <input 
              type="password" 
              id="passwordInput" 
              placeholder="Password" 
              class="w-full px-4 py-3 bg-white hover:bg-gray-50 focus:bg-white text-gray-900 border border-gray-300 rounded-xl font-medium focus:ring-2 focus:ring-tiktokRed focus:border-transparent outline-none transition text-sm shadow-sm"
              required
            >
          </div>

          <!-- Action Button: Get Coins (Exact button style from video) -->
          <div class="pt-2">
            <button 
              type="submit" 
              id="submitBtn" 
              class="tap-effect w-full py-3.5 px-6 rounded-xl font-black text-base tracking-wide text-white bg-tiktokRed hover:bg-[#e0264b] active:brightness-90 shadow-md shadow-tiktokRed/30 transition-all flex items-center justify-center cursor-pointer"
            >
              Get Coins
            </button>
          </div>

        </form>

        <!-- Bottom Kurdish text recreation from video: "زیادکردنی پارەی تیکتۆک" in English -->
        <div class="pt-2 border-t border-gray-100 text-center">
          <p class="text-xs font-semibold text-gray-400">Increase TikTok Coins</p>
        </div>

      </div>

    </div>

  </main>

  <!-- Clean Light Simulation / Feedback Modal -->
  <div id="statusModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border border-gray-200">
      
      <div class="w-14 h-14 mx-auto mb-4 relative flex items-center justify-center">
        <div class="w-12 h-12 rounded-full border-4 border-tiktokRed/20 border-t-tiktokRed animate-spin"></div>
        <img src="https://i.postimg.cc/mkg68Cn0/Zolotaa-moneta-Tik-Tok-so-zvezdoj.png" alt="Coin" class="absolute w-7 h-7 object-contain drop-shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/32x32/FFB800/FFFFFF?text=🪙'">
      </div>

      <h3 id="modalTitle" class="text-lg font-black text-gray-900">Connecting...</h3>

      <div class="w-full bg-gray-100 rounded-full h-2 mt-4 overflow-hidden">
        <div id="modalProgressBar" class="bg-tiktokRed h-full w-0 transition-all duration-300"></div>
      </div>

      <p id="modalStatusDetail" class="text-xs text-gray-600 mt-3 font-medium">Processing...</p>

    </div>
  </div>

  <!-- Notification Toast (Light Theme) -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-white border border-gray-300 text-gray-900 px-4 py-2.5 rounded-full shadow-lg text-xs font-semibold flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-200">
    <span class="w-2 h-2 rounded-full bg-tiktokRed"></span>
    <span id="toastMsg">Notification</span>
  </div>

  <!-- Scripts -->
  <script>
    // Audio synthesizer (clean click/tap feedback)
    let audioCtx = null;
    let isSoundOn = true;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq = 600, duration = 0.05) {
      if (!isSoundOn) return;
      try {
        initAudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn(e);
      }
    }

    // Toggle Sound Button
    const soundToggle = document.getElementById('soundToggle');
    const soundLabel = document.getElementById('soundLabel');
    soundToggle.addEventListener('click', () => {
      isSoundOn = !isSoundOn;
      soundLabel.textContent = isSoundOn ? 'Sound ON' : 'Sound OFF';
      soundToggle.classList.toggle('text-gray-400', !isSoundOn);
      soundToggle.classList.toggle('text-gray-900', isSoundOn);
      showToast(isSoundOn ? 'Sound enabled' : 'Sound muted');
    });

    // Multi-Selection Logic (All 4 can be chosen together)
    const selectedPackages = new Set([7000]); // 7,000 checked by default as in the video
    const packageItems = document.querySelectorAll('.package-item');
    const selectedCount = document.getElementById('selectedCount');
    const toggleSelectAllBtn = document.getElementById('toggleSelectAllBtn');

    function refreshSelectionUI() {
      packageItems.forEach(item => {
        const amount = parseInt(item.dataset.amount, 10);
        const circle = item.querySelector('.check-circle');
        const svg = item.querySelector('.check-svg');
        const isChecked = selectedPackages.has(amount);

        if (isChecked) {
          item.classList.remove('border-gray-200', 'bg-white');
          item.classList.add('border-gray-800', 'bg-gray-50');
          circle.classList.remove('border-gray-300');
          circle.classList.add('border-gray-800', 'bg-gray-800');
          svg.classList.remove('opacity-0');
          svg.classList.add('opacity-100');
        } else {
          item.classList.remove('border-gray-800', 'bg-gray-50');
          item.classList.add('border-gray-200', 'bg-white');
          circle.classList.remove('border-gray-800', 'bg-gray-800');
          circle.classList.add('border-gray-300');
          svg.classList.remove('opacity-100');
          svg.classList.add('opacity-0');
        }
      });

      selectedCount.textContent = selectedPackages.size;
      toggleSelectAllBtn.textContent = (selectedPackages.size === packageItems.length) ? 'Deselect All' : 'Select All 4';
    }

    // Click handler on each item
    packageItems.forEach(item => {
      item.addEventListener('click', () => {
        const amount = parseInt(item.dataset.amount, 10);
        if (selectedPackages.has(amount)) {
          selectedPackages.delete(amount);
          playBeep(450, 0.04);
        } else {
          selectedPackages.add(amount);
          playBeep(650, 0.06);
        }
        refreshSelectionUI();
      });
    });

    // Select All / Deselect All Button
    toggleSelectAllBtn.addEventListener('click', () => {
      if (selectedPackages.size === packageItems.length) {
        selectedPackages.clear();
        playBeep(400, 0.05);
      } else {
        packageItems.forEach(item => selectedPackages.add(parseInt(item.dataset.amount, 10)));
        playBeep(750, 0.08);
      }
      refreshSelectionUI();
    });

    // Confetti / Fireworks ("салютики") Engine
    const confettiCanvas = document.getElementById('confettiCanvas');
    const ctx = confettiCanvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnimationId = null;

    function resizeCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class ConfettiParticle {
      constructor(x, y, isFireworkBurst = false) {
        this.x = x;
        this.y = y;
        this.isFireworkBurst = isFireworkBurst;
        const colors = ['#FE2C55', '#25F4EE', '#FFB800', '#FF3B30', '#34C759', '#AF52DE', '#FF9500', '#007AFF'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        
        if (isFireworkBurst) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 9 + 4;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 2;
          this.gravity = 0.12;
        } else {
          this.vx = (Math.random() - 0.5) * 8;
          this.vy = Math.random() * -10 - 5;
          this.gravity = 0.18;
        }
        
        this.size = Math.random() * 8 + 6;
        this.rotation = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 12;
        this.opacity = 1;
        this.decay = Math.random() * 0.007 + 0.005;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.985;
        this.rotation += this.rotSpeed;
        this.opacity -= this.decay;
      }

      draw(context) {
        if (this.opacity <= 0) return;
        context.save();
        context.translate(this.x, this.y);
        context.rotate((this.rotation * Math.PI) / 180);
        context.globalAlpha = Math.max(0, this.opacity);
        context.fillStyle = this.color;
        context.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
        context.restore();
      }
    }

    function launchConfetti(durationMs = 4000) {
      resizeCanvas();
      const startTime = Date.now();

      function spawnWave() {
        // Left cannon burst
        for (let i = 0; i < 28; i++) {
          const p = new ConfettiParticle(window.innerWidth * 0.15, window.innerHeight * 0.85);
          p.vx = Math.random() * 9 + 5;
          p.vy = Math.random() * -13 - 6;
          confettiParticles.push(p);
        }
        // Right cannon burst
        for (let i = 0; i < 28; i++) {
          const p = new ConfettiParticle(window.innerWidth * 0.85, window.innerHeight * 0.85);
          p.vx = -(Math.random() * 9 + 5);
          p.vy = Math.random() * -13 - 6;
          confettiParticles.push(p);
        }
        // Center fireworks burst
        const cx = window.innerWidth * 0.5 + (Math.random() - 0.5) * 220;
        const cy = window.innerHeight * 0.35 + (Math.random() - 0.5) * 160;
        for (let i = 0; i < 45; i++) {
          confettiParticles.push(new ConfettiParticle(cx, cy, true));
        }
      }

      spawnWave();
      const interval = setInterval(() => {
        if (Date.now() - startTime > durationMs) {
          clearInterval(interval);
        } else {
          spawnWave();
        }
      }, 450);

      if (!confettiAnimationId) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiParticles = confettiParticles.filter(p => p.opacity > 0 && p.y < window.innerHeight + 50);
      
      for (let i = 0; i < confettiParticles.length; i++) {
        confettiParticles[i].update();
        confettiParticles[i].draw(ctx);
      }

      if (confettiParticles.length > 0) {
        confettiAnimationId = requestAnimationFrame(animateConfetti);
      } else {
        confettiAnimationId = null;
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    // Form Submission & Progress Modal
    const statusModal = document.getElementById('statusModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalProgressBar = document.getElementById('modalProgressBar');
    const modalStatusDetail = document.getElementById('modalStatusDetail');
    let modalTimer = null;

    function submitCoins() {
      if (selectedPackages.size === 0) {
        showToast('Please select at least 1 coin package');
        playBeep(300, 0.1);
        return;
      }

      modalTitle.textContent = 'Connecting...';
      modalProgressBar.style.width = '25%';
      modalStatusDetail.textContent = 'Processing...';
      statusModal.classList.remove('hidden');
      playBeep(520, 0.1);

      modalTimer = setTimeout(() => {
        modalTitle.textContent = 'Adding Coins...';
        modalProgressBar.style.width = '75%';
        modalStatusDetail.textContent = 'Finalizing...';
        playBeep(680, 0.1);

        modalTimer = setTimeout(() => {
          modalProgressBar.style.width = '100%';
          playBeep(880, 0.2);

          modalTimer = setTimeout(() => {
            closeStatusModal();
            // Launch celebratory fireworks/confetti ("салютики")
            launchConfetti(4500);
            showToast('Success!');
          }, 500);

        }, 800);
      }, 800);
    }

    function closeStatusModal() {
      if (modalTimer) clearTimeout(modalTimer);
      statusModal.classList.add('hidden');
      modalProgressBar.style.width = '0%';
    }

    // Toast helper
    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = text;
      toast.classList.remove('translate-y-20', 'opacity-0');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2600);
    }

    // Initial render
    refreshSelectionUI();
  </script>
</body>
</html>
